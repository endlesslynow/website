<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Kurmanji and Dari</title>
<link rel="stylesheet" href="../reader/css/font.css">
<link rel="stylesheet" href="../reader/css/reader.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<main>
  <!-- today's date in English, Kurmanji and Dari -->
  <header id="date" class="date" hidden>
    <p id="date-ku" class="date-ku" lang="kmr"></p>
    <p id="date-en" class="date-en"></p>
    <p id="date-fa" class="date-fa" lang="fa" dir="rtl"></p>
  </header>
  <!-- the day's dialogue twice: Kurmanji on the left, Dari on the right.
       A word shows its sound and meaning; the number after a line shows the English. -->
  <div class="pair-papers">
    <article id="paper-ku" class="paper" lang="kmr" dir="ltr"></article>
    <article id="paper-fa" class="paper" lang="fa" dir="rtl"></article>
  </div>
  <p id="none" class="none" hidden>There is no dialogue for today yet.</p>
</main>
<script src="calendar.js"></script>
    <script defer src="../js/goatcounter.js"></script>
</body>
</html>
