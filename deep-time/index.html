<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Walk through 300,000 years of human history in an interactive 3D landscape." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./app.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="theme-color" content="#192a26" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <title>Deep Time</title>
  <script>
    if (location.protocol === 'file:') addEventListener('DOMContentLoaded', () => {
      document.body.style.cssText = 'margin:0;padding:48px;background:#192a26;color:#f5f2e9;font:16px/1.6 system-ui';
      document.body.innerHTML = '<h1>Deep Time</h1><p>Double-click <strong>Start Deep Time.cmd</strong> in this folder.</p><a style="color:#eed8a7" href="http://127.0.0.1:5173/">Open the running website →</a>';
    });
  </script>
  <script type="module" crossorigin src="./assets/index-CQpGnW16.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three-CDQVr4NA.js">
  <link rel="stylesheet" crossorigin href="./assets/index-x6Wspni4.css">
</head>
<body>
  <main id="experience" tabindex="-1" aria-label="Human history timeline. Use arrow keys or WASD to explore. Right goes into the past; left returns toward the present.">
    <div id="scene" aria-hidden="true"></div>
    <div id="history-labels" aria-label="Nearby buildings and events"></div>
    <header class="hud-top">
      <div class="time-panel panel"><h1><span id="year">2,026</span><span id="year-suffix">CE</span></h1><div class="species-clock"><div id="clock-caption">If all of our species' existence totaled an hour, it would be:</div><span id="time-remaining" aria-labelledby="clock-caption">60:00</span></div><div class="generations"><span id="generation-count">0</span> generations ago<a href="https://doi.org/10.1126/sciadv.abm7047" target="_blank" rel="noopener noreferrer" title="Approximate count using 27 years per generation, rounded from a study's 26.9-year average over the past 250,000 years; applied here to the full timeline.">Estimate: 27 years per generation</a></div></div>
      <div class="tools panel">
        <button id="places-button" aria-label="Browse buildings, empires and events" aria-expanded="false" aria-controls="places-panel" title="Places & history">▤</button>
        <button id="sound-button" aria-label="Turn sound on" aria-pressed="false" title="Sound"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path id="sound-waves" d="m17 9 5 6m0-6-5 6"/></svg></button>
        <button id="fullscreen-button" aria-label="Enter full screen" title="Full screen"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg></button>
        <button id="restart-button" aria-label="Restart at 2026" title="Restart">↺</button>
      </div>
    </header>
    <div id="empires" aria-label="Empires at this date"></div>
    <aside id="places-panel" class="panel" aria-label="Places and history" hidden>
      <div class="places-heading"><strong>Places & history</strong><button id="places-close" aria-label="Close places">×</button></div>
      <nav class="history-tabs" aria-label="History category"><button data-history-category="buildings" aria-pressed="true">Buildings</button><button data-history-category="empires" aria-pressed="false">Empires</button><button data-history-category="events" aria-pressed="false">Events</button></nav>
      <input id="places-search" type="search" placeholder="Find a place or period" aria-label="Find a place or period" />
      <div id="places-list"></div>
    </aside>
    <div id="place-selected" class="panel" hidden></div>
    <div class="zoom panel"><button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button><span aria-hidden="true"></span><button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button></div>
    <div id="load-status" class="status panel" role="status">Loading…</div>
    <div id="error-panel" class="status panel" role="alert" hidden><p id="error-message">WebGL could not start.</p><button id="reload-button">Reload</button></div>
    <div id="finish" class="finish panel" role="status" hidden>300,000 BCE <span>5.04 km ✓</span></div>
    <footer class="hud-bottom">
      <div class="mobile-walk-hint" aria-hidden="true">Present &larr; &nbsp; Hold arrows to explore &nbsp; &rarr; Past</div>
      <div class="walk-controls panel"><button id="walk-up" aria-label="Hold to walk up" title="Up arrow / W">&#8593;</button><button id="walk-left" aria-label="Hold to walk toward the present" title="Hold left arrow">←</button><button id="auto-button" aria-label="Start auto-walk" aria-pressed="false" title="Auto-walk / Space"><svg id="play-icon" width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="m6 3 11 7-11 7Z"/></svg><span id="play-label">Walk</span></button><button id="walk-right" aria-label="Hold to walk into the past" title="Hold right arrow">→</button><button id="walk-down" aria-label="Hold to walk down" title="Down arrow / S">&#8595;</button></div>
      <div class="timeline-panel panel">
        <label class="mobile-jump">Jump to <select id="era-select" aria-label="Jump to a date"><option value="" selected>Choose a date</option><option value="2026">2026 CE</option><option value="-19999">20,000 BCE</option><option value="-49999">50,000 BCE</option><option value="-124999">125,000 BCE</option><option value="-299999">300,000 BCE</option></select></label>
        <div class="journey-stats"><span id="distance">0 m <small>/ 5,040 m</small></span></div>
        <div class="timeline-track"><div class="timeline-baseline"></div><div id="timeline-progress"></div><div class="timeline-ticks" aria-hidden="true"></div><div id="timeline-cursor"></div><input id="timeline-scrubber" type="range" min="0" max="5040" step="0.01" value="0" aria-label="Timeline position in metres" /></div>
        <div class="timeline-labels"><button data-year="2026">2026 CE</button><button data-year="-19999">20,000 BCE</button><button data-year="-49999">50,000 BCE</button><button data-year="-124999">125,000 BCE</button><button data-year="-299999">300,000 BCE</button></div>
      </div>
    </footer>
  </main>
</body>
</html>
