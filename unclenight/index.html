<!doctype html>
<html lang="fa-AF" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کاکای شو</title>
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 16 16"><path d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9zM1 6.5a5.5 5.5 0 1 1 9.9 3.3l3.6 3.6l-1.4 1.4l-3.6-3.6A5.5 5.5 0 0 1 1 6.5z" fill="currentColor"/></symbol>
    <symbol id="i-eye" viewBox="0 0 16 16"><path d="M8 3C4.5 3 2 5.5 1 8c1 2.5 3.5 5 7 5s6-2.5 7-5c-1-2.5-3.5-5-7-5zm0 8a3 3 0 1 1 0-6a3 3 0 0 1 0 6zm0-4.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3z" fill="currentColor"/></symbol>
    <symbol id="i-tape" viewBox="0 0 16 16"><path d="M1 3h14v10H1zM2 4v8h12V4zM4.5 6a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3zm7 0a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3zM5 10h6l1 2H4z" fill="currentColor"/></symbol>
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M3 8l5-5v3h5v4H8v3z" fill="currentColor" transform="rotate(180 8 8)"/></symbol>
    <symbol id="i-again" viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.7 7.9l1.9-.6A4 4 0 1 0 5 5.2L7 7H1V1l2.5 2.5A6 6 0 0 1 8 2z" fill="currentColor"/></symbol>
    <symbol id="i-power" viewBox="0 0 16 16"><path d="M7 1h2v7H7zM4.2 3.4l1.3 1.5A4.5 4.5 0 1 0 10.5 5l1.3-1.5A6.5 6.5 0 1 1 4.2 3.4z" fill="currentColor"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 60 36"><rect x="1.25" y="1.25" width="57.5" height="33.5" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><g fill="currentColor"><rect x="6.75" y="6" width="4.5" height="5" rx=".8"/><rect x="12.75" y="6" width="4.5" height="5" rx=".8"/><rect x="18.75" y="6" width="4.5" height="5" rx=".8"/><rect x="24.75" y="6" width="4.5" height="5" rx=".8"/><rect x="30.75" y="6" width="4.5" height="5" rx=".8"/><rect x="36.75" y="6" width="4.5" height="5" rx=".8"/><rect x="42.75" y="6" width="4.5" height="5" rx=".8"/><rect x="48.75" y="6" width="4.5" height="5" rx=".8"/><rect x="9.75" y="13" width="4.5" height="5" rx=".8"/><rect x="15.75" y="13" width="4.5" height="5" rx=".8"/><rect x="21.75" y="13" width="4.5" height="5" rx=".8"/><rect x="27.75" y="13" width="4.5" height="5" rx=".8"/><rect x="33.75" y="13" width="4.5" height="5" rx=".8"/><rect x="39.75" y="13" width="4.5" height="5" rx=".8"/><rect x="45.75" y="13" width="4.5" height="5" rx=".8"/><rect x="6.75" y="20" width="4.5" height="5" rx=".8"/><rect x="12.75" y="20" width="4.5" height="5" rx=".8"/><rect x="18.75" y="20" width="4.5" height="5" rx=".8"/><rect x="24.75" y="20" width="4.5" height="5" rx=".8"/><rect x="30.75" y="20" width="4.5" height="5" rx=".8"/><rect x="36.75" y="20" width="4.5" height="5" rx=".8"/><rect x="42.75" y="20" width="4.5" height="5" rx=".8"/><rect x="48.75" y="20" width="4.5" height="5" rx=".8"/><rect x="15" y="27" width="30" height="4" rx=".8"/></g></symbol>
    <symbol id="i-none" viewBox="0 0 16 16"><path d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9zM1 6.5a5.5 5.5 0 1 1 9.9 3.3l3.6 3.6l-1.4 1.4l-3.6-3.6A5.5 5.5 0 0 1 1 6.5zM4 4.7l.7-.7L6.5 5.8L8.3 4l.7.7L7.2 6.5L9 8.3l-.7.7L6.5 7.2L4.7 9L4 8.3L5.8 6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M4 2h3v12H4zm5 0h3v12H9z" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M4 2l10 6l-10 6z" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M3.5 2L8 6.5L12.5 2L14 3.5L9.5 8L14 12.5L12.5 14L8 9.5L3.5 14L2 12.5L6.5 8L2 3.5z" fill="currentColor"/></symbol>
    <symbol id="i-del" viewBox="0 0 16 16"><path d="M5 3h10v10H5L0 8zm2.6 2.4l-.9.9L8.4 8l-1.7 1.7l.9.9L9.3 8.9L11 10.6l.9-.9L10.2 8l1.7-1.7l-.9-.9L9.3 7.1z" fill="currentColor" transform="rotate(180 8 8)"/></symbol>
  </defs>
</svg>

<main id="room">
  <div id="desk">
    <div id="monitor">
      <div id="screen">
        <div id="stage">

          <!-- the computer before it is switched on -->
          <section id="off" class="view">
            <button id="power" type="button" aria-label="روشن کو">
              <svg><use href="#i-power"/></svg>
            </button>
          </section>

          <!-- switching on -->
          <section id="boot" class="view" hidden>
            <div class="boot-box">
              <svg class="boot-icon"><use href="#i-tape"/></svg>
              <div class="boot-bar"><i></i></div>
            </div>
          </section>

          <!-- the archive: search, results, what has been seen -->
          <section id="archive" class="view" hidden>
            <header class="bar">
              <div class="now" dir="rtl"><span id="now-date"></span><span id="now-time" dir="ltr"></span></div>
            </header>
            <form class="search" id="search-form" autocomplete="off">
              <input id="q" name="q" type="text" dir="rtl" lang="fa" spellcheck="false" autocapitalize="off" autocorrect="off" value="کاکای شو" aria-label="کلمه">
              <button type="submit" class="go" id="go"><svg><use href="#i-search"/></svg><span>پیدا کو</span></button>
            </form>
            <div class="found" id="found"></div>
            <div class="results" id="results"></div>
            <footer class="seen">
              <div class="seen-label"><svg><use href="#i-eye"/></svg><span>دیده شده</span></div>
              <div class="slots" id="slots"></div>
            </footer>
          </section>

          <!-- watching a recording -->
          <section id="player" class="view" hidden>
            <canvas id="tv" width="768" height="576"></canvas>
            <!-- what the camcorder writes over its picture -->
            <div class="osd">
              <div class="osd-info">
                <span class="osd-line" id="osd-name"></span>
                <span class="osd-line" id="osd-place"></span>
                <span class="osd-line" id="osd-tape"></span>
                <span class="osd-line osd-time" id="stamp-time" dir="ltr"></span>
                <span class="osd-line" id="stamp-date" dir="ltr"></span>
              </div>
            </div>
            <!-- one row along the bottom: search again, pause, replay, back -->
            <div class="bottom-row">
              <form class="search after" id="after-form" autocomplete="off" hidden>
                <input id="q2" name="q2" type="text" dir="rtl" lang="fa" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="کلمه">
                <button type="submit" class="go" aria-label="پیدا کو"><svg><use href="#i-search"/></svg></button>
              </form>
              <button type="button" id="pause" class="ctl" aria-label="ایستاد کو"><svg><use href="#i-pause"/></svg></button>
              <button type="button" id="again" class="ctl" aria-label="باز ببین" hidden><svg><use href="#i-again"/></svg></button>
              <button type="button" id="back" class="ctl" aria-label="پس"><svg><use href="#i-back"/></svg></button>
            </div>
          </section>

        </div>
        <div class="glass" aria-hidden="true"></div>
      </div>
      <div id="chin">
        <span class="badge" aria-hidden="true"></span>
        <span class="vents" aria-hidden="true"></span>
        <span class="led" id="led" aria-hidden="true"></span>
      </div>
    </div>

    <div id="keyboard" dir="ltr" aria-label="کیبورد" hidden>
      <button type="button" id="kb-close" class="kb-close" aria-label="بسته کو"><svg><use href="#i-close"/></svg></button>
      <div class="krow"></div><div class="krow"></div><div class="krow"></div><div class="krow"></div>
    </div>
  </div>

  <!-- beside the computer: the transcript on a sheet of old paper, the
       button that puts the keyboard out or away, and a numbered key for each
       sentence of the recording once it has played to its end -->
  <aside id="side">
    <div id="paper">
      <p class="subs" id="subs"></p>
      <!-- shown only when a line is too long for one sheet -->
      <button type="button" id="page-turn" class="page-turn" aria-label="ورق دگه" hidden><svg><use href="#i-back"/></svg><span id="page-count"></span></button>
      <!-- a word's meaning, when the player clicks the word -->
      <div id="gloss" class="gloss" role="status" hidden><b id="gloss-word"></b><i id="gloss-say" dir="ltr" lang="en"></i><div id="gloss-mean" class="mean" lang="en"></div></div>
    </div>
    <div class="side-keys">
      <button type="button" id="kb-open" class="kb-open" aria-label="کیبورد" aria-pressed="false"><svg><use href="#i-keyboard"/></svg></button>
      <div id="parts" class="parts" hidden></div>
    </div>
  </aside>
</main>

<script src="js/data.js"></script>
<script src="js/lexicon.js"></script>
<script src="js/glossary.js"></script>
<script src="js/search.js"></script>
<script src="js/characters.js"></script>
<script src="js/art.js"></script>
<script src="js/places.js"></script>
<script src="js/camcorder.js"></script>
<script src="js/sound.js"></script>
<script src="js/main.js"></script>
</body>
</html>
